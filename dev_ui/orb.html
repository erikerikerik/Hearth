<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearth Orb Lab</title>
<style>html{color-scheme:dark}body{margin:0;background:#100906;color:#d7c39a;font:14px ui-monospace,monospace}header{display:flex;gap:18px;align-items:center;padding:14px 20px;border-bottom:1px solid #6f5526}main{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}.pane{min-width:0;border:1px solid #6f5526;border-radius:12px;padding:12px;background:#080504}.stage{aspect-ratio:1;max-height:70vh;display:grid;place-items:center}.stage canvas{width:min(100%,70vh);height:auto;aspect-ratio:1}.metrics{white-space:pre-wrap;color:#b8aa91}select,button{font:inherit;color:inherit;background:#21160d;border:1px solid #8f6c31;border-radius:6px;padding:6px 9px}@media(max-width:760px){main{grid-template-columns:1fr}}</style></head>
<body><header><strong>Orb contract lab · synthetic fixtures only</strong><label>Fixture <select id="fixture"></select></label><button id="motion">Reduced motion: off</button></header><main><section class="pane"><label>Left <select id="left"></select></label><div class="stage"><canvas id="a" width="640" height="640"></canvas></div><pre class="metrics" id="ma"></pre></section><section class="pane"><label>Right <select id="right"></select></label><div class="stage"><canvas id="b" width="640" height="640"></canvas></div><pre class="metrics" id="mb"></pre></section></main>
<script type="module">
import{register,resolve,listRenderers}from'/orb/registry.js';import{fallbackRingFactory}from'/orb/fallback-ring.js';import{filamentV1Factory}from'/orb/filament-v1.js';import{createSeededRng}from'/orb/seeded-rng.js';
register(fallbackRingFactory);register(filamentV1Factory);const fixtures=await(await fetch('/dev/orb-fixtures')).json();const $=s=>document.querySelector(s);let reduced=false,controllers=[],frame=0;
for(const f of fixtures)$('#fixture').add(new Option(f.name,f.name));for(const r of listRenderers()){for(const id of['left','right'])$('#'+id).add(new Option(r.name,r.name))}$('#left').value='filament-v1';$('#right').value='fallback-ring';
function reset(){for(const x of controllers)x.renderer.dispose();controllers=[];frame=0;const f=fixtures.find(x=>x.name===$('#fixture').value);for(const [canvas,id,m] of [[$('#a'),'left','#ma'],[$('#b'),'right','#mb']]){const host={canvas,rng:createSeededRng(f.seed),reducedMotion:reduced,quality:'high',log:console.warn};const renderer=resolve($('#'+id).value).create(host);renderer.resize({width:640,height:640,dpr:1,cx:320,cy:320,radius:218,wellRadius:116});controllers.push({renderer,m})}}
function tick(){const f=fixtures.find(x=>x.name===$('#fixture').value),input=f.frames[frame%f.frames.length];for(const event of f.events.filter(e=>Math.abs(e.at-input.t)<.03))for(const x of controllers)x.renderer.event?.(event);for(const x of controllers){x.renderer.frame({...input,dt:1/f.fps,bands:new Float32Array(input.bands)});$(x.m).textContent=JSON.stringify(x.renderer.metrics?.(),null,2)}frame++;requestAnimationFrame(tick)}
for(const id of['fixture','left','right'])$('#'+id).addEventListener('change',reset);$('#motion').onclick=()=>{reduced=!reduced;$('#motion').textContent='Reduced motion: '+(reduced?'on':'off');reset()};reset();tick();
</script></body></html>
